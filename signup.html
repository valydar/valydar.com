<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Valydar</title>
<meta name="description" content="Create your Valydar account and start verifying identities.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🛡️</text></svg>">
<script src="/env.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --accent:#6366f1;--accent-light:#818cf8;--accent-dark:#4f46e5;
    --bg:#0a0a0f;--bg-alt:#111119;--surface:#16161f;--surface-light:#1e1e2a;
    --border:#2a2a3a;--text:#e4e4ed;--muted:#8888a0;--white:#fff;
    --success:#22c55e;--error:#ef4444;
    --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'SF Mono','Cascadia Code','Fira Code',monospace;
  }
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  a{color:var(--accent-light);text-decoration:none;transition:color .2s}
  a:hover{color:var(--white)}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .nav-logo{font-size:20px;font-weight:700;color:var(--white);display:flex;align-items:center;gap:8px}
  .nav-logo span{color:var(--accent)}
  .nav-links{display:flex;gap:24px;align-items:center}
  .nav-links a{color:var(--muted);font-size:14px;font-weight:500;transition:color .2s}
  .nav-links a:hover{color:var(--white)}

  .auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;margin-top:80px}
  .auth-card h1{font-size:24px;font-weight:700;color:var(--white);margin-bottom:8px}
  .auth-card p{color:var(--muted);font-size:14px;margin-bottom:32px}
  .form-group{margin-bottom:20px}
  .form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .form-group input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:var(--font);transition:border-color .2s}
  .form-group input:focus{outline:none;border-color:var(--accent)}
  .form-group input::placeholder{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:var(--font)}
  .btn-primary{background:var(--accent);color:var(--white)}
  .btn-primary:hover{background:var(--accent-dark);color:var(--white);transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:12px 16px;color:var(--error);font-size:13px;margin-bottom:20px;display:none}
  .error-msg.show{display:block}
  .divider{text-align:center;color:var(--muted);font-size:13px;margin:24px 0;position:relative}
  .divider::before,.divider::after{content:'';position:absolute;top:50%;width:calc(50% - 20px);height:1px;background:var(--border)}
  .divider::before{left:0}
  .divider::after{right:0}
  .auth-footer{text-align:center;margin-top:24px;font-size:14px;color:var(--muted)}
  .auth-footer a{color:var(--accent-light)}
  .password-requirements{font-size:12px;color:var(--muted);margin-top:6px}
  .password-requirements span{display:block;padding:2px 0}
  .password-requirements span.met{color:var(--success)}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><span>◆</span> valydar</a>
  <div class="nav-links">
    <a href="https://docs.valydar.com">Docs</a>
    <a href="/signin.html">Sign In</a>
  </div>
</nav>

<div class="auth-card">
  <h1>Create your account</h1>
  <p>Start verifying identities in minutes.</p>

  <div class="error-msg" id="error"></div>

  <form id="signup-form" onsubmit="return handleSignup(event)">
    <div class="form-group">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="Jane Doe" required autocomplete="name">
    </div>
    <div class="form-group">
      <label for="email">Work email</label>
      <input type="email" id="email" name="email" placeholder="jane@company.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" oninput="checkPassword()">
      <div class="password-requirements">
        <span id="pw-len">At least 8 characters</span>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="submit-btn">Create Account</button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="/signin.html">Sign in</a>
  </div>
</div>

<script>
const API = window.VALYDAR_API_BASE || 'https://api.valydar.com';

function checkPassword() {
  const pw = document.getElementById('password').value;
  const len = document.getElementById('pw-len');
  len.className = pw.length >= 8 ? 'met' : '';
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
}

function hideError() {
  document.getElementById('error').classList.remove('show');
}

async function handleSignup(e) {
  e.preventDefault();
  hideError();

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (password.length < 8) {
    showError('Password must be at least 8 characters');
    return false;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const res = await fetch(API + '/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error?.message || 'Signup failed');
    }

    localStorage.setItem('valydar_token', data.token);
    localStorage.setItem('valydar_user', JSON.stringify(data.user));
    window.location.href = '/dashboard.html';
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }

  return false;
}

// Redirect if already logged in
if (localStorage.getItem('valydar_token')) {
  window.location.href = '/dashboard.html';
}
</script>
</body>
</html>
