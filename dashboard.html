<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Valydar</title>
<meta name="description" content="Your Valydar account dashboard.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🛡️</text></svg>">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --accent:#6366f1;--accent-light:#818cf8;--accent-dark:#4f46e5;
    --bg:#0a0a0f;--bg-alt:#111119;--surface:#16161f;--surface-light:#1e1e2a;
    --border:#2a2a3a;--text:#e4e4ed;--muted:#8888a0;--white:#fff;
    --success:#22c55e;--warning:#eab308;--error:#ef4444;
    --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'SF Mono','Cascadia Code','Fira Code',monospace;
  }
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--accent-light);text-decoration:none;transition:color .2s}
  a:hover{color:var(--white)}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,15,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .nav-logo{font-size:20px;font-weight:700;color:var(--white);display:flex;align-items:center;gap:8px}
  .nav-logo span{color:var(--accent)}
  .nav-links{display:flex;gap:24px;align-items:center}
  .nav-links a{color:var(--muted);font-size:14px;font-weight:500;transition:color .2s}
  .nav-links a:hover{color:var(--white)}
  .nav-user{color:var(--text);font-size:13px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;gap:6px}

  .container{max-width:960px;margin:0 auto;padding:96px 24px 48px}
  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px}
  .page-header h1{font-size:28px;font-weight:700;color:var(--white)}
  .page-header p{color:var(--muted);font-size:14px;margin-top:4px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:24px}
  .card h2{font-size:17px;font-weight:600;color:var(--white);margin-bottom:16px}
  .card h2 small{font-weight:400;font-size:13px;color:var(--muted)}

  .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
  .info-row:last-child{border-bottom:none}
  .info-label{color:var(--muted)}
  .info-value{color:var(--text);font-weight:500;text-align:right}
  .info-value.mono{font-family:var(--mono);font-size:13px}

  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .badge-success{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3)}
  .badge-warning{background:rgba(234,179,8,.15);color:var(--warning);border:1px solid rgba(234,179,8,.3)}
  .badge-error{background:rgba(239,68,68,.15);color:var(--error);border:1px solid rgba(239,68,68,.3)}
  .badge-neutral{background:rgba(136,136,160,.1);color:var(--muted);border:1px solid var(--border)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:var(--font)}
  .btn-primary{background:var(--accent);color:var(--white)}
  .btn-primary:hover{background:var(--accent-dark);color:var(--white);transform:translateY(-1px)}
  .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-secondary:hover{border-color:var(--accent);color:var(--white)}
  .btn-danger{background:rgba(239,68,68,.15);color:var(--error);border:1px solid rgba(239,68,68,.3)}
  .btn-danger:hover{background:rgba(239,68,68,.25)}
  .btn-sm{padding:6px 14px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  .empty-state{text-align:center;padding:32px 16px}
  .empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5}
  .empty-state h3{font-size:16px;font-weight:600;color:var(--white);margin-bottom:8px}
  .empty-state p{color:var(--muted);font-size:14px;max-width:400px;margin:0 auto}

  .alert{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;align-items:flex-start;gap:12px;margin-bottom:24px}
  .alert-icon{font-size:20px;flex-shrink:0;line-height:1}
  .alert-content{flex:1}
  .alert-content strong{display:block;font-size:14px;color:var(--white);margin-bottom:4px}
  .alert-content p{font-size:13px;color:var(--muted)}
  .alert-warning{border-color:rgba(234,179,8,.3)}
  .alert-success{border-color:rgba(34,197,94,.3)}
  .alert-success .alert-content strong{color:var(--success)}

  .key-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
  .key-card:last-child{margin-bottom:0}
  .key-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .key-name{font-size:14px;font-weight:600;color:var(--white)}
  .key-role{font-size:11px;color:var(--muted);margin-left:8px}
  .key-preview{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .key-created{font-size:12px;color:var(--muted);margin-top:4px}

  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
  .modal-overlay.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:480px;width:100%}
  .modal h2{font-size:18px;font-weight:600;color:var(--white);margin-bottom:8px}
  .modal p{color:var(--muted);font-size:14px;margin-bottom:24px}
  .modal .form-group{margin-bottom:16px}
  .modal .form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .modal .form-group input,.modal .form-group select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:var(--font);transition:border-color .2s}
  .modal .form-group input:focus,.modal .form-group select:focus{outline:none;border-color:var(--accent)}
  .modal .btn-row{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}

  .key-reveal{background:var(--bg);border:1px solid var(--success);border-radius:8px;padding:16px;margin-top:16px;text-align:center}
  .key-reveal pre{font-family:var(--mono);font-size:14px;color:var(--success);padding:12px;background:var(--bg-alt);border-radius:6px;margin:12px 0;word-break:break-all}
  .key-reveal .warning{color:var(--warning);font-size:12px}

  @media(max-width:640px){
    .container{padding:80px 16px 32px}
    .card{padding:20px}
    .page-header{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><span>◆</span> valydar</a>
  <div class="nav-links">
    <a href="https://docs.valydar.com">Docs</a>
    <a href="#" id="signout-link" style="display:none" onclick="signOut()">Sign Out</a>
  </div>
</nav>

<div class="container">
  <div class="page-header" id="page-header">
    <div>
      <h1>Dashboard</h1>
      <p id="user-email">Loading...</p>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="signOut()" id="signout-btn" style="display:none">Sign Out</button>
  </div>

  <div id="content">
    <div class="card" style="text-align:center;padding:48px">
      <p style="color:var(--muted)">Loading dashboard...</p>
    </div>
  </div>
</div>

<!-- Create Key Modal -->
<div class="modal-overlay" id="create-key-modal">
  <div class="modal">
    <h2>Create API Key</h2>
    <p>Give your key a name and choose a role. The key will only be shown once.</p>
    <div class="form-group">
      <label for="key-name">Client name</label>
      <input type="text" id="key-name" placeholder="e.g. Production" required>
    </div>
    <div class="form-group">
      <label for="key-role">Role</label>
      <select id="key-role">
        <option value="service">Service (read + write)</option>
        <option value="readonly">Read-only</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeCreateKeyModal()">Cancel</button>
      <button class="btn btn-primary" id="create-key-btn" onclick="createApiKey()">Create Key</button>
    </div>
    <div id="key-result" style="display:none"></div>
  </div>
</div>

<script>
const API = window.VALYDAR_API_BASE || 'https://api.dev.valydar.com';

// ── Auth helpers ──
function getToken() { return localStorage.getItem('valydar_token'); }
function getUser() {
  try { return JSON.parse(localStorage.getItem('valydar_user')); }
  catch { return null; }
}

function requireAuth() {
  const token = getToken();
  if (!token) {
    window.location.href = '/signin.html';
    return null;
  }
  return token;
}

function signOut() {
  localStorage.removeItem('valydar_token');
  localStorage.removeItem('valydar_user');
  window.location.href = '/';
}

async function apiAuth(path, opts = {}) {
  const token = requireAuth();
  if (!token) throw new Error('not authenticated');
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
  if (res.status === 401) {
    signOut();
    throw new Error('session expired');
  }
  const data = await res.json();
  if (!res.ok) {
    throw new Error(data.error?.message || 'request failed (' + res.status + ')');
  }
  return data;
}

// ── Render Dashboard ──
async function renderDashboard() {
  const token = requireAuth();
  if (!token) return;

  const user = getUser();
  if (!user) {
    signOut();
    return;
  }

  document.getElementById('user-email').textContent = user.email || user.name;

  try {
    // Fetch fresh user data + keys
    const [profile, keys] = await Promise.all([
      apiAuth('/auth/me'),
      apiAuth('/auth/keys')
    ]);

    // Update stored user
    localStorage.setItem('valydar_user', JSON.stringify(profile));

    const content = document.getElementById('content');
    content.innerHTML = '';

    const paymentStatus = profile.payment_status;
    const needsPayment = paymentStatus === 'none';
    const paymentPending = paymentStatus === 'pending';
    const paymentActive = paymentStatus === 'active';
    const emailVerified = profile.email_verified === true || profile.email_verified === undefined;

    // ── Email verification alert ──
    if (!emailVerified) {
      content.innerHTML += `
        <div class="alert alert-warning">
          <div class="alert-icon">✉️</div>
          <div class="alert-content">
            <strong>Verify your email</strong>
            <p>Please check your inbox and click the verification link. Some features may be limited until your email is confirmed.</p>
          </div>
        </div>`;
    }

    // ── Payment alert ──
    if (needsPayment) {
      content.innerHTML += `
        <div class="alert alert-warning">
          <div class="alert-icon">⚠️</div>
          <div class="alert-content">
            <strong>Payment method required</strong>
            <p>You need to add a payment method before you can create API keys. Your account is currently on the Sandbox plan.</p>
            <button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="startCheckout(this)">Add Payment Method →</button>
          </div>
        </div>`;
    } else if (paymentPending) {
      content.innerHTML += `
        <div class="alert alert-warning">
          <div class="alert-icon">⏳</div>
          <div class="alert-content">
            <strong>Payment pending</strong>
            <p>We're waiting for your payment to be confirmed. This usually takes just a moment. Reload to check status.</p>
            <button class="btn btn-secondary btn-sm" style="margin-top:12px" onclick="location.reload()">Reload</button>
          </div>
        </div>`;
    } else if (paymentActive) {
      content.innerHTML += `
        <div class="alert alert-success">
          <div class="alert-icon">✅</div>
          <div class="alert-content">
            <strong>Payment active</strong>
            <p>Your payment method is confirmed. You can now create and manage API keys.</p>
          </div>
        </div>`;
    }

    // ── Profile card ──
    content.innerHTML += `
      <div class="card">
        <h2>Profile</h2>
        <div class="info-row">
          <span class="info-label">Name</span>
          <span class="info-value">${esc(profile.name)}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Email</span>
          <span class="info-value">${esc(profile.email)}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Account ID</span>
          <span class="info-value mono">${esc(profile.id)}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Payment Status</span>
          <span class="info-value">${paymentBadge(paymentStatus)}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Created</span>
          <span class="info-value">${formatDate(profile.created_at)}</span>
        </div>
        <div class="info-row" style="border-bottom:none;padding-top:16px">
          <a href="/forgot-password.html" style="font-size:13px;color:var(--accent-light)">Change password →</a>
        </div>
      </div>`;

    // ── API Keys card ──
    let keysHtml = '';
    if (keys.length === 0) {
      keysHtml = `
        <div class="empty-state">
          <div class="icon">🔑</div>
          <h3>No API keys yet</h3>
          <p>${needsPayment ? 'Add a payment method to create your first API key.' : 'Create an API key to start integrating the Valydar API.'}</p>
          ${needsPayment ? '' : '<button class="btn btn-primary" style="margin-top:16px" onclick="showCreateKeyModal()">Create API Key</button>'}
        </div>`;
    } else {
      keysHtml = keys.map(k => `
        <div class="key-card">
          <div class="key-header">
            <div>
              <span class="key-name">${esc(k.client_name)}</span>
              <span class="key-role badge badge-neutral">${esc(k.role)}</span>
            </div>
            <button class="btn btn-danger btn-sm" onclick="revokeKey('${k.id}')">Revoke</button>
          </div>
          <div class="key-preview">${esc(k.id)}</div>
          <div class="key-created">Created ${formatDate(k.created_at)}</div>
        </div>
      `).join('');
      if (!needsPayment) {
        keysHtml += '<div style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="showCreateKeyModal()">+ Create API Key</button></div>';
      }
    }

    content.innerHTML += `
      <div class="card">
        <h2>API Keys <small>— ${keys.length} of 10</small></h2>
        ${keysHtml}
      </div>`;

  } catch (err) {
    document.getElementById('content').innerHTML = `
      <div class="card" style="text-align:center;padding:48px">
        <p style="color:var(--error)">Error: ${esc(err.message)}</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="location.reload()">Reload</button>
      </div>`;
  }
}

// ── Helpers ──
function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function paymentBadge(status) {
  switch (status) {
    case 'active': return '<span class="badge badge-success">Active</span>';
    case 'pending': return '<span class="badge badge-warning">Pending</span>';
    case 'none': default: return '<span class="badge badge-error">Not set up</span>';
  }
}

// ── Checkout ──
async function startCheckout(btn) {
  btn.disabled = true;
  btn.textContent = 'Redirecting...';

  try {
    const data = await apiAuth('/billing/checkout', {
      method: 'POST',
      body: JSON.stringify({
        price_id: 'price_1Ty8InL62xH1NZ1XKEQkOOqF',
        success_url: window.location.origin + '/dashboard.html?checkout=success',
        cancel_url: window.location.origin + '/dashboard.html?checkout=cancel'
      })
    });
    window.location.href = data.url;
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Add Payment Method →';
    alert('Failed to start checkout: ' + err.message);
  }
}

// ── API Key Management ──
function showCreateKeyModal() {
  document.getElementById('key-name').value = '';
  document.getElementById('key-role').value = 'service';
  document.getElementById('key-result').style.display = 'none';
  document.getElementById('key-result').innerHTML = '';
  document.getElementById('create-key-btn').disabled = false;
  document.getElementById('create-key-btn').textContent = 'Create Key';
  document.getElementById('create-key-modal').classList.add('show');
}

function closeCreateKeyModal() {
  document.getElementById('create-key-modal').classList.remove('show');
}

async function createApiKey() {
  const name = document.getElementById('key-name').value.trim();
  const role = document.getElementById('key-role').value;

  if (!name) {
    alert('Please enter a client name');
    return;
  }

  const btn = document.getElementById('create-key-btn');
  btn.disabled = true;
  btn.textContent = 'Creating...';

  try {
    const data = await apiAuth('/auth/keys', {
      method: 'POST',
      body: JSON.stringify({ client_name: name, role })
    });

    document.getElementById('key-result').innerHTML = `
      <div class="key-reveal">
        <p style="font-size:13px;color:var(--muted);margin-bottom:8px">Your new API key:</p>
        <pre>${esc(data.key)}</pre>
        <p class="warning">⚠️ Copy this key now. It will not be shown again.</p>
        <button class="btn btn-primary btn-sm" onclick="closeCreateKeyModal();location.reload()">Done</button>
      </div>`;
    document.getElementById('key-result').style.display = 'block';
    document.getElementById('create-key-btn').style.display = 'none';

    // Copy to clipboard
    try {
      await navigator.clipboard.writeText(data.key);
    } catch {}
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Create Key';
    alert('Failed to create key: ' + err.message);
  }
}

async function revokeKey(keyId) {
  if (!confirm('Are you sure you want to revoke this API key? This cannot be undone.')) return;

  try {
    await apiAuth('/auth/keys/' + keyId, { method: 'DELETE' });
    location.reload();
  } catch (err) {
    alert('Failed to revoke key: ' + err.message);
  }
}

// ── Check for Stripe checkout redirect ──
const params = new URLSearchParams(window.location.search);
if (params.get('checkout') === 'success') {
  // Remove the query param and refresh
  window.history.replaceState({}, '', '/dashboard.html');
  // Show a success message overlay
  setTimeout(() => {
    alert('Payment method added successfully! You can now create API keys.');
    location.reload();
  }, 500);
}

// ── Init ──
if (!getToken()) {
  window.location.href = '/signin.html';
} else {
  renderDashboard();
}
</script>
</body>
</html>
