<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Valydar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🛡️</text></svg>">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--accent:#6366f1;--accent-light:#818cf8;--accent-dark:#4f46e5;--bg:#0a0a0f;--surface:#16161f;--border:#2a2a3a;--text:#e4e4ed;--muted:#8888a0;--white:#fff;--success:#22c55e;--error:#ef4444;--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  a{color:var(--accent-light);text-decoration:none}
  nav{position:fixed;top:0;left:0;right:0;background:rgba(10,10,15,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .nav-logo{font-size:20px;font-weight:700;color:var(--white);display:flex;align-items:center;gap:8px}
  .nav-logo span{color:var(--accent)}
  .card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;margin-top:80px}
  .card h1{font-size:24px;font-weight:700;color:var(--white);margin-bottom:8px}
  .card p{color:var(--muted);font-size:14px;margin-bottom:24px}
  .form-group{margin-bottom:16px}
  .form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .form-group input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:var(--font)}
  .form-group input:focus{outline:none;border-color:var(--accent)}
  .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;font-family:var(--font)}
  .btn-primary{background:var(--accent);color:var(--white)}
  .btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
  .msg.success{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--success)}
  .msg.error{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--error)}
  .auth-footer{text-align:center;margin-top:24px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo"><span>◆</span> valydar</a>
</nav>
<div class="card">
  <h1>Reset password</h1>
  <p>Enter your email and we'll send you a reset link.</p>
  <div id="msg" class="msg"></div>
  <form id="form" onsubmit="return handleForgot(event)">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@company.com" required>
    </div>
    <button type="submit" class="btn btn-primary" id="btn">Send Reset Link</button>
  </form>
  <div class="auth-footer"><a href="/signin.html">Back to sign in</a></div>
</div>
<script>
const API = window.VALYDAR_API_BASE || 'https://api.dev.valydar.com';
async function handleForgot(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  const msg = document.getElementById('msg');
  try {
    const res = await fetch(API + '/auth/forgot-password', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Request failed');
    msg.className = 'msg success';
    msg.textContent = 'If that email exists, a reset link has been sent. Check your inbox.';
    document.getElementById('form').style.display = 'none';
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = err.message;
  }
  btn.disabled = false; btn.textContent = 'Send Reset Link';
  return false;
}
</script>
</body>
</html>
